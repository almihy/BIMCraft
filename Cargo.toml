[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
# GUIDs: the system's random numbers.
getrandom = "0.3"
tempfile = "3"
rayon = "1.12"
bimcraft-core = { path = "crates/core" }
bimcraft-plugin = { path = "crates/plugin" }
bimcraft-i18n = { path = "crates/i18n", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
# Deflates PDF streams; png, under tiny-skia, already builds it.
flate2 = "1"
# Reads the JPEGs a texture is made of; the PNGs come in through tiny-skia.
zune-jpeg = "0.5"
# Import PDF: a page rasterised and its vector lines read, in pure Rust so the core still builds for the browser
# (Apache-2.0 OR MIT; its stand-ins for the 14 standard fonts are PDFium's, BSD: NOTICE).
hayro = { version = "0.9", default-features = false, features = ["embed-fonts"] }
# Insert > Image: PNG, JPEG and BMP read, and an image's pixels kept as PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# The code pages a DXF's header names: the East Asian ones Latin-1 cannot read.
encoding_rs = "0.8"
# Its default features are the desktop app's window; a page's (apps/bimcraft-web) asks for fewer: see its [features].
bimcraft-ui-egui = { path = "crates/ui-egui", default-features = false }
bimcraft-update = { path = "crates/update" }
# The Revit reader: Apache-2.0 only, so the command line and the desktop take it through an optional feature.
bimcraft-rvt = { path = "crates/rvt" }
# The DWG bridge: MIT OR Apache-2.0 itself, over acadrust (MPL-2.0, unmodified); the core never depends on it.
bimcraft-dwg = { path = "crates/dwg" }
# Without their default features, so that the browser's build leaves egui's own fonts out (ui-egui's `egui-fonts`): each
# member asks for what it uses.
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
# The system's language, on Windows and macOS too, where no environment variable says it.
sys-locale = "0.3"
# The updater's: versions, HTTPS (rustls, with ring and the Mozilla roots built in) and SHA-256 (ring's, the one rustls brings).
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
# The Revit reader's: Revit's files are Compound Files (OLE), and a byte search that scans the partitions fast.
cfb = "0.15"
memchr = "2"
# Text notes' fonts: IBM Plex's outlines, its weights too, read from the files the packages carry.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
# The site's shapes (site/poly.rs): polygon booleans, offsets (butt ends, mitred and round joins) and lines clipped by
# polygons, in pure Rust so the core still builds for the browser.
i_overlay = { version = "9.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# The 3D view renders in software: build the core optimised in debug builds too, so it orbits smoothly.
[profile.dev.package.bimcraft-core]
opt-level = 2

# The Revit reader inflates and scans tens of megabytes per file, which its real-file tests do over and over.
[profile.dev.package.bimcraft-rvt]
opt-level = 2
# DWG files are decoded bit by bit.
[profile.dev.package.acadrust]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.cfb]
opt-level = 2
# PDF pages are parsed and drawn by hayro on vello_cpu: tests import them, and a debug window reads them.
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.hayro-syntax]
opt-level = 2
[profile.dev.package.hayro-font]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2

# The browser builds (crates/web, apps/bimcraft-web), which a page downloads: `cargo build --profile wasm`. Optimised for
# size (s: 24 MB, 5.9 MB as brotli, against 27 MB and 6.7 MB at 3, and no slower to open or draw in the browser), as one
# unit optimised whole (LTO), with no unwinding (WebAssembly aborts on a panic anyway) and no symbols.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
