[package]
name = "bimcraft-workspace-hack"
description = "Not code: the features the workspace's members turn on in the model's dependencies, asked for in one place, so the model builds the same for every cargo command"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Why, and how to keep it: CLAUDE.md beside this file.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bimcraft-i18n = { workspace = true, features = ["default", "catalog"] }
either = { version = "1.19", features = ["use_std"] }
fearless_simd = { version = "0.4", default-features = false, features = ["std"] }
foldhash = { version = "0.2", features = ["std"] }
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
hashbrown-016 = { package = "hashbrown", version = "0.16", features = ["inline-more", "raw-entry"] }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
log = { version = "0.4", features = ["std"] }
memchr = { version = "2.8", features = ["std"] }
num-traits = { version = "0.2", features = ["libm"] }
once_cell = "1.21"
proc-macro2 = { version = "1", features = ["span-locations"] }
read-fonts = { version = "0.41", default-features = false, features = ["experimental_font_api", "std"] }
serde_core = { version = "1", features = ["alloc", "rc", "result", "std"] }
skrifa = { version = "0.44", default-features = false, features = ["autohint_shaping", "std"] }
syn = { version = "2", features = ["full", "visit"] }
syn-3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
thiserror = "2"
vello_common = { version = "0.1", default-features = false, features = ["std"] }
vello_cpu = { version = "0.1", default-features = false, features = ["f32_pipeline", "png", "std", "u8_pipeline"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
bimcraft-i18n = { workspace = true, features = ["default", "catalog"] }
either = { version = "1.19", features = ["use_std"] }
fastrand = "2.5"
log = { version = "0.4", features = ["std"] }
memchr = { version = "2.8", features = ["std"] }
once_cell = "1.21"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_core = { version = "1", features = ["alloc", "rc", "result", "std"] }
syn = { version = "2", features = ["full", "visit"] }
syn-3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[lints]
workspace = true
