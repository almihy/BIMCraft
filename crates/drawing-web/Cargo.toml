[package]
name = "bimcraft-drawing-web"
description = "Drawings (DWG, DXF) read and asked of in the browser, for Arqiflow's agent: CADCraft's index with this engine's Pick Lines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Its own WebAssembly, small beside the engine's (crates/web): a page that reads drawings for the agent loads this, not
# the whole engine. What it takes of the engine is the outlines' code (bimcraft_core::cad::outlines and the drawing it
# reads); the linker keeps only what that reaches.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bimcraft-core = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.129"
getrandom = { workspace = true, features = ["wasm_js"] }
cadcraft-index = { workspace = true }
cadcraft-io = { workspace = true }
# A DWG read as DXF by acadrust itself (its re-export here), for what Arqiflow's server still reads as DXF.
cadcraft-dwg = { workspace = true }
# The drawing reader's instruments (src/clean.rs) work on CADCraft's drawing itself, and draw a picture of a part of it.
cadcraft-doc = { workspace = true }
cadcraft-render = { workspace = true }

[dev-dependencies]
# The tests look at a picture's pixels.
image = { workspace = true }
