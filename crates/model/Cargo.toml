[package]
name = "bimcraft-model"
description = "BIMCraft's building model: elements, types, families, the library, schedules, and what each element is in 3D"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bimcraft-i18n = { workspace = true }
bimcraft-geom = { workspace = true }
bimcraft-site = { workspace = true }
bimcraft-mep-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true }
flate2 = { workspace = true }
zune-jpeg = { workspace = true }
encoding_rs = { workspace = true }
getrandom = { workspace = true }
rayon = { workspace = true }
ttf-parser = { workspace = true }
# Right-to-left text on the canvas (text.rs): its runs ordered, and shaped so that Arabic joins. The versions the
# interface's text already builds (vendor/epaint).
harfrust = "0.12"
unicode-bidi = "0.3.18"
i_overlay = { workspace = true }
hayro = { workspace = true }
png = "0.18"
image = { workspace = true }
# DWG drawings read into CADCraft's drawing, which dxf/dwg.rs makes an import of.
cadcraft-doc = { workspace = true }
cadcraft-dwg = { workspace = true }

# The browser's clock (Rust's std has none there): today's date on a title block.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# The features the workspace turns on in this crate's dependencies, all of them for every command, so that switching
# between `cargo test -p` of one crate and another, `--workspace` and `cargo build` does not rebuild this crate. Not in
# the browser's build, which is a release build of its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bimcraft-workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
