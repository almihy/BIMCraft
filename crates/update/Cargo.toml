[package]
name = "bimcraft-update"
description = "BIMCraft's updater: asks GitHub for a newer release, downloads its installer and checks it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `testing::Fake`, a network that is a table of answers, for the desktop's tests too.
testing = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }

# The browser (Arqiflow's build of the interface) has no updater: no network, and ring's C does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
ring = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sha2 = "0.10"
