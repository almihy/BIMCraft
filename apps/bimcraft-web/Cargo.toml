[package]
name = "bimcraft-webapp"
description = "BIMCraft's desktop interface in the browser (eframe's web runner), for Arqiflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bimcraft-core = { workspace = true }
bimcraft-ui-egui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
js-sys = "0.3"
serde_json = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window"] }
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
